global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'solply-dev-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']

  - job_name: 'jmeter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9270']