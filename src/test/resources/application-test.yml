spring:
  datasource:
    url: jdbc:h2:mem:solply;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

decorator:
  datasource:
    enabled: false

solply:
  place-list-snapshot:
    # 리빌드 폴은 사실상 멈춘다 — 리빌드는 테스트가 명시적으로 부르는 것만 돌아야 한다.
    # 기동 빌드는 폴을 기다리지 않으므로(SnapshotScheduler) 이 값이 커도 기동이 멈추지 않는다.
    poll-interval-ms: 3600000
    # 연달아 부르는 리빌드가 최소 간격에 걸려 조용히 건너뛰지 않게 한다.
    min-rebuild-interval-ms: 1

app:
  env-prefix: test

aws:
  enabled: false
  accessKey: test
  secretKey: test
  s3:
    bucket: solply-test