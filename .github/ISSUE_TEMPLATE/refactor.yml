    id: refactor-contents
    attributes:
      label: 🎨 리팩토링 이슈 설명
      description: 어떤 것과 관련된 이슈인지 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: solve-steps
    attributes:
      label: ✅ 작업할 내용
      description: 리팩토링하기 위해 작업할 내용을 체크박스 형태로 작성해 주세요.
      value: |
        - [ ] 작업
        - [ ] 
        - [ ]
    validations:
      required: true
