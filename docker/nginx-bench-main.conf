# 벤치 LB 메인 설정 — nginx:1.27-alpine 기본 nginx.conf에서 커넥션 한도만 올렸다.
#
# ⚠️ 왜 nginx-bench.conf가 아니라 별 파일인가:
# worker_connections는 main 컨텍스트의 events 블록 지시자이고 worker_rlimit_nofile도
# main 컨텍스트다. nginx-bench.conf는 /etc/nginx/conf.d/default.conf로 마운트되는
# http 컨텍스트 조각이라 두 지시자를 담을 수 없다 ("events directive is not allowed here"로
# 기동 실패). 그래서 메인 설정을 통째로 덮어쓴다.
#
# 배경 (2026-08-04 read-ceiling 캠페인): 도착 500/s 측정에서 기본값 1024가 고갈돼
# "1024 worker_connections are not enough" 경고 2,694건이 났고, 그중 upstream 연결 실패
# 160건이 그대로 HTTP 500이 됐다 (artillery가 집계한 500 총합과 정확히 일치). 즉 앱·DB와
# 무관한 제3의 천장이 측정에 섞여 있었다. 이는 개선이 아니라 계측 결함 제거이고
# saturation-amplification 캠페인의 A/B 양쪽에 동일 적용된다.
#
# 8192 산정: 요청 하나가 클라이언트 연결 1 + upstream 연결 1을 쓰므로 worker당 동시
# 4,000요청분이다. 도착 500/s에서 지연 10초까지 적체돼도 동시 5,000건 규모라 worker가
# auto(=11)로 나뉘는 것을 감안하면 충분히 여유가 있다.
# worker_rlimit_nofile 16384: 연결마다 fd를 쓰므로 worker_connections의 2배를 잡는다.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 16384;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  8192;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
