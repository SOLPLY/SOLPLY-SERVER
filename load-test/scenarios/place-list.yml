config:
  target: "http://localhost:8082"
  payload:
    path: "../data/users.csv"
    fields:
      - token
    order: random
    skipHeader: true
  phases:
    - name: "Warm up"
      duration: 30
      arrivalRate: 5
    - name: "Ramp up"
      duration: 60
      arrivalRate: 10
      rampTo: 50
    - name: "Sustained load"
      duration: 120
      arrivalRate: 50
  environments:
    # 장소 캐시 벤치마크용 (#381): 안정 상태 비교만 필요 — 회당 55초
    bench:
      phases:
        - name: "Warm up"
          duration: 10
          arrivalRate: 20
        - name: "Sustained load"
          duration: 45
          arrivalRate: 50
  plugins:
    metrics-by-endpoint:
      useOnlyRequestNames: true

scenarios:
  - name: "place-list-no-tag"
    weight: 50
    flow:
      - get:
          url: "/api/places"
          qs:
            townId: 2
            isBookmarkSearch: false
          name: "GET /api/places (no-tag)"
          headers:
            Authorization: "Bearer {{ token }}"

  - name: "place-list-main-tag"
    weight: 50
    flow:
      - get:
          url: "/api/places"
          qs:
            townId: 2
            isBookmarkSearch: false
            mainTagId: 1
          name: "GET /api/places (main-tag)"
          headers:
            Authorization: "Bearer {{ token }}"
