# 벤치 전용 로드밸런서 — 다중 인스턴스가 가용성 고정 스펙이므로 실환경을 재현한다.
# least_conn: 요청 처리 시간 편차(캐시 히트/미스)가 있으므로 round-robin보다 균등하다.
upstream solply_bench {
    least_conn;
    server bench-app-1:8082 max_fails=3 fail_timeout=10s;
    server bench-app-2:8082 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # 부하 테스트라 LB가 병목이 되면 안 된다 — 액세스 로그 비활성화
    access_log off;

    location / {
        proxy_pass http://solply_bench;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
