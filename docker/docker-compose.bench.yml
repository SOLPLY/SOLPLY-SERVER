# 벤치마크 전용 환경 (#379 북마크 인덱스 → 인기순 정렬 벤치로 확장)
# - MySQL: 데이터+인덱스 전부 버퍼풀에 상주하도록 2G (디스크 I/O 노이즈 제거)
# - 앱: bench-app-1/2 컨테이너 2대 + nginx LB(bench-lb) 구성. 호스트 bootRun(run-app.sh)은 디버깅용
# - 부하는 항상 LB(localhost:8082)로 보낸다 — 개별 인스턴스 포트는 노출하지 않는다
# 기동: ./gradlew bootJar && docker compose -f docker/docker-compose.bench.yml up -d --build
services:
  bench-mysql:
    container_name: solply-bench-mysql
    image: mysql:8.0
    ports:
      - "3310:3306"
    environment:
      MYSQL_DATABASE: solply_bench_db
      MYSQL_USER: solplyuser
      MYSQL_PASSWORD: solplyuserpwd
      MYSQL_ROOT_PASSWORD: rootpwd
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=2G
      - --innodb-redo-log-capacity=1G
      - --max-connections=200
    cpus: 4
    mem_limit: 4g
    volumes:
      - solply-bench-mysql-data:/var/lib/mysql
    networks:
      bench-net:
        ipv4_address: 172.28.0.10

  bench-redis:
    # 캐시-on baseline(#377 이전 커밋) 측정 전용. 현행 코드 측정에도 앱 기동 의존성으로 필요.
    container_name: solply-bench-redis
    image: redis:7
    ports:
      - "6382:6379"
    command: [ "redis-server", "--requirepass", "solplyredispwd" ]
    cpus: 1
    mem_limit: 512m
    networks:
      bench-net:
        ipv4_address: 172.28.0.11

  # 부하 모델(DAU 2만, 예상 피크 22 req/s, 목표 120 req/s = 5.5배 헤드룸) 기준 실서버 체급 재현.
  # 2 vCPU/2G ≈ 비용 현실적인 단일 인스턴스. 가용성을 위해 2대 + LB 구성이 고정 스펙이다.
  # Little's law: 120 req/s × 30ms ≈ 동시 ~4
  bench-app-1: &bench-app
    container_name: solply-bench-app-1
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment: &bench-app-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://bench-mysql:3306/solply_bench_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8"
      SPRING_DATASOURCE_USERNAME: solplyuser
      SPRING_DATASOURCE_PASSWORD: solplyuserpwd
      SPRING_DATA_REDIS_HOST: bench-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: solplyredispwd
      SERVER_PORT: "8082"
      SERVER_TOMCAT_THREADS_MAX: "50"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "10"
      JAVA_TOOL_OPTIONS: "-Xmx1280m -XX:MaxMetaspaceSize=256m"
      # 쿼리 로깅을 끈다. application.yml의 p6spy: INFO를 그대로 두면 초당 240쿼리를
      # 전문(full SQL text)으로 로깅해 앱 CPU가 2 vCPU에 포화되고, PK 단건 조회가
      # 495ms까지 늘어나 레이턴시 측정이 무의미해진다 (실측으로 확인).
      # 쿼리 "카운트"를 재야 할 때만 LOGGING_LEVEL_P6SPY=INFO로 별도 라운드를 돌리고,
      # 그 라운드의 레이턴시는 다른 라운드와 비교하지 않는다.
      LOGGING_LEVEL_P6SPY: "OFF"
      LOGGING_LEVEL_ORG_FLYWAYDB: "WARN"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE: "WARN"
      # v0 벤치 시: BENCH_APP_JSON='{"solply.place-list.popular-read-mode":"db"}' docker compose ... up -d
      SPRING_APPLICATION_JSON: ${BENCH_APP_JSON:-{}}
    cpus: 2
    mem_limit: 2g
    depends_on:
      - bench-mysql
      - bench-redis
    networks:
      bench-net:
        ipv4_address: 172.28.0.21

  bench-app-2:
    <<: *bench-app
    container_name: solply-bench-app-2
    environment:
      <<: *bench-app-env
    # 앵커가 networks까지 상속하므로 반드시 오버라이드한다 (같은 IP면 기동 실패)
    networks:
      bench-net:
        ipv4_address: 172.28.0.22

  # 부하는 항상 LB(8082)로 보낸다. 개별 인스턴스 직접 접근은 포트를 노출하지 않는다 —
  # 실환경에서 클라이언트가 인스턴스를 지정할 수 없는 조건을 그대로 재현하기 위함.
  bench-lb:
    container_name: solply-bench-lb
    image: nginx:1.27-alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx-bench.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bench-app-1
      - bench-app-2
    # nginx는 upstream 호스트명을 설정 파싱 시점에 해석한다. 두 앱 컨테이너가 아직
    # 생성되지 않은 순간에 뜨면 [emerg] host not found로 즉시 죽으므로 자동 복구시킨다.
    restart: unless-stopped
    networks:
      bench-net:
        ipv4_address: 172.28.0.30

volumes:
  solply-bench-mysql-data:

# 고정 IP를 쓰는 이유:
# nginx OSS는 upstream 호스트명을 설정 파싱 시점에 한 번만 해석하고 프로세스 수명 내내
# 그 IP를 캐시한다 (재해석은 nginx Plus의 `resolve` 파라미터 전용). Docker 기본 네트워크는
# 컨테이너 재기동 시 IP를 재할당하므로, 앱만 재기동하면 nginx가 stale IP를 붙들고
# 전 요청이 502가 된다 — 실제로 겪었고 원인 파악에 시간이 걸리는 종류의 함정이다.
# 코드 변경마다 앱을 재기동하게 되므로 규율(= 앱 재기동 시 LB도 재기동)에 의존하지 않고
# 주소를 고정해 실패 모드 자체를 제거한다.
networks:
  bench-net:
    name: solply-bench-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
