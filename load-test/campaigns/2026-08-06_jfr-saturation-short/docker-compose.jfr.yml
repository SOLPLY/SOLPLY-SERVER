services:
  bench-app:
    # 기존 JRE에도 jdk.jfr 모듈과 jfr CLI가 있다. 실행 중 attach 도구(jcmd)만 없으므로
    # 기동 시 녹화를 시작한다. 앱/DB 자원과 나머지 환경 변수는 bench compose를 그대로 상속한다.
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xmx1280m -XX:MaxMetaspaceSize=256m
        -XX:StartFlightRecording=name=saturation,settings=/solply/cpu-hotspots.jfc,filename=/tmp/solply-saturation.jfr,dumponexit=true,disk=true,maxsize=128m
    volumes:
      - ./../load-test/campaigns/2026-08-06_jfr-saturation-short/cpu-hotspots.jfc:/solply/cpu-hotspots.jfc:ro
