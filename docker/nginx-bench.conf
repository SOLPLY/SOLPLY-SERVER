# 벤치 전용 edge — 부하 분산이 아니라 운영 경로(TLS 종단·보안 헤더·요청 제어 앞단) 재현이
# 목적이다. 앱은 1대이므로 upstream도 하나다 (2026-08-05, 설계 §6).
#
# max_fails=0으로 서킷브레이커를 무력화한다. 지난 캠페인(2026-08-04 read-ceiling)에서
# 포화 구간의 응답 지연이 nginx의 실패 카운트를 채워 upstream이 차단됐고, 그 뒤 요청이
# "no live upstreams" 502로 나가 포화 모양 자체를 왜곡했다. upstream이 하나면 차단이 곧
# 전면 장애라 기능적으로도 의미가 없다 — 앱이 죽는 것과 nginx가 끊는 것을 구분해야 한다.
upstream solply_bench {
    server bench-app:8082 max_fails=0;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # 부하 테스트라 LB가 병목이 되면 안 된다 — 액세스 로그 비활성화
    access_log off;

    location / {
        proxy_pass http://solply_bench;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
