name: Continuous Integration

on:
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create application.yml
        env:
          APPLICATION_DEV_YML: ${{ secrets.APPLICATION_DEV_YML }}
        run: |
          mkdir -p src/main/resources
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("src/main/resources/application.yml")
          p.write_text(os.environ["APPLICATION_DEV_YML"], encoding="utf-8")
          PY

      - name: Create gradle.properties
        env:
          GRADLE_DEV_PROPERTIES: ${{ secrets.GRADLE_DEV_PROPERTIES }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path("gradle.properties")
          p.write_text(os.environ["GRADLE_DEV_PROPERTIES"], encoding="utf-8")
          PY

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test
        shell: bash